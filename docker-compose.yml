version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: seajet-app:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: seajet
      DB_USERNAME: seajet
      DB_PASSWORD: seajet
    volumes:
      - ./.env:/var/www/html/.env
      - storage_data:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: seajet
      MYSQL_USER: seajet
      MYSQL_PASSWORD: seajet
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: seajet
      PMA_PASSWORD: seajet
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
  storage_data:
